<!DOCTYPE html>

        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f9f9f9; }
        h2 { color: #333; border-bottom: 2px solid #4A90E2; padding-bottom: 10px; max-width: 600px; }
